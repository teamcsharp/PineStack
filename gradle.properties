org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The device is arm64-v8a only (MediaTek MT6768). Building the other three
# ABIs would triple the native build time for code that can never run on the
# one machine this app is for - see app/build.gradle.kts abiFilters.
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official
