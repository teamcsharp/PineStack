<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mark up the tablet's screen</title>
  <link rel="stylesheet" href="shot-editor.css">
</head>
<body>
  <!-- THE MARK-UP WINDOW.

       "Pop it up in a window that allows me to do a draw over where I'm able
        to click and drag and draw things on it and make arrows and indicators
        and do overlays of text overlays that I'm able to scale and adjust in
        real time... and allow me to then copy that modified image to
        clipboard after modifying it. Offer the same tools that I have in
        ShareX."

       EVERYTHING DRAWN IS AN OBJECT, not paint. An arrow put down ten marks
       ago can still be moved, restyled, resized or deleted, which is the only
       way "adjust in real time" can mean anything - a painted stroke can only
       be undone, and only if it was the last thing you did. -->

  <div id="bar" class="bar">
    <div class="tools" id="tools"></div>
    <div class="sep"></div>

    <label class="swatchWrap" title="Colour of the next mark, and of whatever is selected">
      <input id="colour" type="color" value="#ff3b30">
    </label>
    <div class="stack" title="How thick the line is">
      <input id="weight" type="range" min="1" max="200" step="1" value="4">
      <span id="weightSaid" class="said">4</span>
    </div>
    <button id="fillBtn" class="toggle" title="Draw shapes filled instead of outlined">fill</button>
    <div class="stack" title="Text size">
      <input id="fontSize" type="range" min="10" max="600" step="1" value="28">
      <span id="fontSaid" class="said">28</span>
    </div>

    <!-- THE SIZE OF WHAT COMES NEXT, or of what is selected. The same
         action as Ctrl+wheel, which is a gesture nobody finds by looking. -->
    <div class="group" role="group" aria-label="Annotation size">
      <button id="smaller" class="act" title="Smaller (Ctrl+wheel down)">&minus;</button>
      <span id="markScale" class="said" title="How big new marks are, against the size chosen for this picture">100%</span>
      <button id="bigger" class="act" title="Bigger (Ctrl+wheel up)">+</button>
    </div>

    <div class="sep"></div>
    <button id="undoBtn" class="act" title="Undo (Ctrl+Z)">&#8630;</button>
    <button id="redoBtn" class="act" title="Redo (Ctrl+Shift+Z)">&#8631;</button>
    <button id="deleteBtn" class="act" data-pine-icon="c:trash-can"
            aria-label="Delete what is selected"
            title="Delete what is selected (Del)"></button>
    <button id="clearBtn" class="act" title="Remove every mark">clear</button>

    <div class="sep"></div>
    <!-- THE RESOLUTION, resampled from the picture the tablet actually sent
         rather than from the copy on screen. The ceiling is capped from the
         source: a canvas past about 268 megapixels comes back blank. -->
    <div class="stack" title="How far the picture is enlarged. Resampled from the original every time.">
      <input id="times" type="range" min="1" max="8" step="1" value="2">
      <span id="timesSaid" class="said">2&times;</span>
    </div>
    <select id="how" title="How the extra pixels are worked out"></select>

    <div class="sep"></div>
    <!-- Wheel to zoom, middle button to pan, 0 to fit. The readout is here
         rather than in the status line because the status line is where the
         picture talks about itself, and this is about the view. -->
    <button id="fitBtn" class="act"
            title="Fit the whole picture in the window (0).&#10;Roll the wheel over the picture to zoom, middle-drag to pan.">fit</button>
    <span id="zoomSaid" class="said" title="How far in the view is zoomed">100%</span>

    <div class="grow"></div>
    <!-- INSPECTION MODE. The picture stops being pixels and becomes the
         things it is a picture of: click to hear one, right-click for what
         can be done with it. -->
    <button id="inspectBtn" class="act" data-pine-icon="c:microscope"
            aria-label="Inspection mode"
            title="Inspection mode: click anything in the picture to hear it, right-click for more.&#10;The drawing tools wait while this is on."></button>
    <button id="copyBtn" class="go" title="Copy the marked-up picture to the clipboard (Ctrl+C)">Copy</button>
    <button id="saveBtn" class="act" title="Save it as a PNG (Ctrl+S)">Save</button>
  </div>

  <div id="stage" class="stage">
    <div id="holder" class="holder">
      <canvas id="canvas"></canvas>
      <!-- Text is typed into a real input sitting exactly over the mark, so
           the caret, selection and IME all behave the way they do everywhere
           else. It is drawn on the canvas the moment it is committed. -->
      <textarea id="typing" class="typing" spellcheck="false" hidden></textarea>
    </div>
  </div>

  <!-- What the station knows about the thing that was clicked. -->
  <aside id="deep" class="deep" hidden>
    <header>
      <span id="deepWhat">Nothing selected</span>
      <button id="deepShut" class="act" title="Close (Esc)"
              data-pine-icon="c:close--filled" aria-label="Close"></button>
    </header>
    <div id="deepBody"></div>
  </aside>

  <!-- Right-click: what can be done with this one. -->
  <div id="menu" class="menu" hidden></div>

  <p id="say" class="say"></p>
  <!-- The station's vendored Carbon sprite, so the bin is a monochrome
       icon rather than a colour emoji. It upgrades data-pine-icon on
       load by itself. The drawing tools above keep their geometric
       glyphs: a rectangle tool drawn as a rectangle IS the icon, and
       Carbon has no drawing-tool glyphs vendored here. -->
  <script src="pine-icons.js"></script>
  <script src="shot-editor.js"></script>
</body>
</html>
