<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Pine audio mixer</title>
  <link rel="stylesheet" href="audio-mixer.css">
</head>
<body>
  <header><h1>Levels</h1><button id="reset" type="button">Reset</button><button id="close" type="button" aria-label="Close mixer">×</button></header>
  <main id="levels" aria-label="Station audio levels"></main>
  <footer>One set for the whole station — a move here moves every screen; the sound is each level times the master. Remembered on the station, and applied as you drag — to what is playing now and everything after it.</footer>
  <p id="status" role="status"></p>
  <script src="audio-mixer.js"></script>
</body>
</html>
