<!DOCTYPE html>
<!--
  HOW THIS LINE CAME TO BE.

  "A pop-up window that shows a flow chart of how the script came to be."

  The station is one assembly line, and this is that line for ONE line: the
  slot that asked for it, the character that was armed, what it was seeded
  from, how it was written, what the crystal and the vectors contributed, how
  it was recorded, and when it went out.

  THE STAGES ARE THE ONES THE STATION ACTUALLY RECORDS, read off a live
  /api/dj/provenance rather than borrowed from a diagram. A stage with
  nothing in it is drawn EMPTY and says so - "made live, while you were
  listening" is a real answer for why the crystal and the tint have nothing,
  and a chart that quietly hid those boxes would be describing a different
  station.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>How it came to be</title>
  <link rel="stylesheet" href="pineicons.css" />
  <link rel="stylesheet" href="script-flow.css" />
</head>
<body>
  <header id="head">
    <div id="who">a line</div>
    <div id="said"></div>
  </header>

  <div id="chart">
    <svg id="spine" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <section id="detail">
    <h3 id="detailWhat">Pick a stage</h3>
    <div id="detailBody"></div>
  </section>

  <p id="note" class="note"></p>

  <script src="pine-icons.js"></script>
  <script src="script-flow.js"></script>
</body>
</html>
