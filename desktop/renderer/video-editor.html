<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Edit video</title>
  <link rel="stylesheet" href="./video-editor.css">
</head>
<body>
  <main class="editor">
    <header class="topbar">
      <button id="back" class="quiet">Back</button>
      <div class="heading"><h1>Edit video</h1><span id="sourceName">Loading your recording</span></div>
      <button id="undo" class="quiet" disabled aria-label="Undo edit">Undo</button>
      <button id="redo" class="quiet" disabled aria-label="Redo edit">Redo</button>
      <button id="save" class="primary" disabled>Save copy</button>
    </header>
    <section class="viewer" id="viewer" aria-label="Video preview">
      <video id="video" playsinline preload="auto"></video>
      <canvas id="preview" aria-label="Video preview and drawing surface"></canvas>
      <div id="loading" class="loading">Loading video…</div>
      <span id="cropHint" class="viewer-note" hidden>Drag the corners or move the box</span>
    </section>
    <div class="playback">
      <button id="play" class="play" disabled aria-label="Play selection">▶</button>
      <output id="position">0:00.00</output>
      <span id="selection">Select the part to keep</span>
      <label class="audio-toggle"><input id="audio" type="checkbox" disabled> <span id="audioLabel">Include audio</span></label>
    </div>
    <p id="audioNotice" class="audio-notice" role="note" hidden></p>
    <section class="timeline-section" aria-label="Trim video">
      <div class="timeline" id="timeline">
        <div id="frames" class="frames"></div>
        <canvas id="wave" class="wave" aria-label="Audio waveform"></canvas>
        <img id="spectrogram" class="spectrogram" alt="Audio frequencies over time" hidden>
        <div id="shadeBefore" class="shade before"></div><div id="shadeAfter" class="shade after"></div>
        <div id="trimBand" class="trim-band"></div>
        <button id="inHandle" class="trim-handle in" aria-label="Trim start" role="slider" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><span></span></button>
        <button id="outHandle" class="trim-handle out" aria-label="Trim end" role="slider" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><span></span></button>
        <div id="playhead" class="playhead"></div>
      </div>
      <div class="timeline-labels"><span id="startLabel">0:00.00</span><button id="soundView" class="link" disabled>Show frequencies</button><span id="endLabel">0:00.00</span></div>
    </section>
    <nav class="tabs" aria-label="Editing tools">
      <button data-tab="trim" class="selected" aria-pressed="true">Trim</button>
      <button data-tab="draw" aria-pressed="false">Draw</button>
      <button data-tab="crop" aria-pressed="false">Crop & rotate</button>
      <button data-tab="adjust" aria-pressed="false">Adjust</button>
    </nav>
    <section class="controls" aria-label="Edit controls">
      <div class="panel" data-panel="trim">
        <label>Start <input id="startTime" type="number" min="0" step="0.01" value="0" inputmode="decimal"></label>
        <label>End <input id="endTime" type="number" min="0" step="0.01" value="0" inputmode="decimal"></label>
        <button id="setStart">Start here</button><button id="setEnd">End here</button><button id="whole">Whole clip</button>
      </div>
      <div class="panel" data-panel="draw" hidden>
        <div class="tool-group" aria-label="Drawing tool"><button data-tool="pen" class="selected" aria-pressed="true">Pen</button><button data-tool="arrow" aria-pressed="false">Arrow</button><button data-tool="box" aria-pressed="false">Box</button></div>
        <label class="color-label">Color <input id="color" type="color" value="#ff453a"></label>
        <label class="stroke-label">Size <input id="weight" type="range" min="2" max="24" value="5" step="1"></label>
        <button id="clearMarks">Clear drawings</button>
      </div>
      <div class="panel" data-panel="crop" hidden>
        <button id="rotate">Rotate ↻</button><button id="fullFrame">Full frame</button>
        <button data-aspect="1">Square</button><button data-aspect="1.7777777778">16:9</button><button data-aspect="0.5625">9:16</button>
        <output id="dimensions"></output>
      </div>
      <div class="panel adjustments" data-panel="adjust" hidden>
        <label>Brightness <input id="brightness" type="range" min="0.5" max="1.5" value="1" step="0.01"><output id="brightnessValue">0</output></label>
        <label>Contrast <input id="contrast" type="range" min="0.5" max="1.5" value="1" step="0.01"><output id="contrastValue">0</output></label>
        <label>Saturation <input id="saturation" type="range" min="0" max="2" value="1" step="0.01"><output id="saturationValue">0</output></label>
        <button id="resetAdjust">Reset</button>
      </div>
    </section>
    <footer><span id="status" role="status" aria-live="polite">Your original recording is kept.</span><button id="retry" class="link" hidden>Try again</button><a id="download" class="link" hidden download>Download copy</a></footer>
  </main>
  <script src="./video-edit-model.js"></script>
  <script src="./video-editor.js"></script>
</body>
</html>
