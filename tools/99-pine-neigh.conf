# The ARP/neighbour table on a Docker host.
#
# 2026-09-13: measured 1019 entries against a gc_thresh3 of 1024 - the hard
# ceiling - with five Docker bridge networks holding ~250 each. dmesg was
# flooding with "neighbour: arp_cache: neighbor table overflow!" and the
# spare Wi-Fi radio could associate with the Pine Cam and then never finish
# an ARP exchange with it: authentication timed out three tries running.
#
# The defaults (128/512/1024) are sized for a machine with one or two
# networks on it. This box has eight bridges before anything else.
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 4096
net.ipv4.neigh.default.gc_thresh3 = 8192
net.ipv6.neigh.default.gc_thresh1 = 1024
net.ipv6.neigh.default.gc_thresh2 = 4096
net.ipv6.neigh.default.gc_thresh3 = 8192
